<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunday Rolls · Analytics</title>
    <link rel="icon" type="image/svg+xml" href="/dashboard/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/dashboard/favicon.png" />
    <link rel="apple-touch-icon" href="/dashboard/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved (or system) theme before first paint.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('sr-dashboard-theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
        try {
          if (localStorage.getItem('sr-dashboard-sidebar') === 'collapsed') document.documentElement.classList.add('sidebar-collapsed')
        } catch (e) {}
      })()
    </script>
    <link rel="stylesheet" href="/dashboard/styles.css?v=3" />
  </head>
  <body>
    <div id="progress" class="progress" aria-hidden="true"><span class="progress-fill"></span></div>
    <aside id="sync-card" class="sync-card" role="status" aria-live="polite" hidden></aside>

    <section id="login-view" class="auth hidden">
      <div class="auth-card card">
        <img class="auth-logo" src="/dashboard/logo.svg" alt="Sunday Rolls" />
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-sub">Store analytics for the Sunday Rolls team.</p>
        <form id="login-form" class="auth-form">
          <label class="field">
            <span>Email</span>
            <input id="login-email" type="email" autocomplete="username" placeholder="you@sundayrollsgolf.com" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
          </label>
          <p id="login-error" class="form-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>
        <p class="auth-hint">Forgot password? Ask Ethan to reset it on the server.</p>
      </div>
    </section>

    <div id="shell" class="shell hidden">
      <aside id="sidebar" class="sidebar" aria-label="Main navigation">
        <a class="sidebar-logo" href="#/overview" aria-label="Sunday Rolls analytics home">
          <img class="sidebar-mark" src="/dashboard/mark.svg" alt="" />
          <span class="sidebar-word">Sunday Rolls<small>Analytics</small></span>
        </a>
        <nav id="sidebar-nav" class="sidebar-nav"></nav>
      </aside>
      <div id="backdrop" class="backdrop" aria-hidden="true"></div>

      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" id="sidebar-toggle" class="btn-square" aria-label="Toggle sidebar" aria-controls="sidebar">
              <span data-icon="menu"></span>
            </button>
            <h1 id="page-title" class="page-title">Overview</h1>
          </div>
          <div class="topbar-right">
            <button type="button" id="theme-toggle" class="btn-round" aria-label="Switch colour theme" title="Switch colour theme">
              <span class="theme-icon-light" data-icon="moon"></span>
              <span class="theme-icon-dark" data-icon="sun"></span>
            </button>
            <button type="button" id="refresh-btn" class="btn-round btn-refresh" title="Refresh data" aria-label="Refresh data">
              <span class="refresh-icon" data-icon="refresh"></span>
              <span class="refresh-label">Refresh</span>
              <span class="refresh-dot" aria-hidden="true"></span>
            </button>
            <div class="user-menu">
              <button type="button" id="user-btn" class="user-btn" aria-haspopup="menu" aria-expanded="false">
                <span id="user-avatar" class="avatar">S</span>
                <span id="user-name" class="user-name"></span>
                <span class="user-chevron" data-icon="chevron-down"></span>
              </button>
              <div id="user-dropdown" class="dropdown" role="menu">
                <div class="dropdown-head">
                  <span id="dropdown-name" class="dropdown-name"></span>
                  <span id="dropdown-email" class="dropdown-email"></span>
                </div>
                <button type="button" id="logout-btn" class="dropdown-item" role="menuitem">
                  <span data-icon="logout"></span> Sign out
                </button>
              </div>
            </div>
          </div>
        </header>

        <main class="content">
          <div class="content-bar">
            <p id="range-label" class="range-label"></p>
            <div class="range-controls">
              <div id="range-pills" class="segmented" role="group" aria-label="Date range">
                <button type="button" data-period="7d">7d</button>
                <button type="button" data-period="30d">30d</button>
                <button type="button" data-period="90d">90d</button>
                <button type="button" data-period="year">YTD</button>
                <button type="button" id="range-custom-btn" data-period="custom" aria-haspopup="dialog" aria-expanded="false">Custom</button>
              </div>
              <div id="range-popover" class="dropdown range-popover" role="dialog" aria-label="Custom date range">
                <form id="range-form" class="range-form">
                  <label class="field"><span>From</span><input id="range-start" type="date" required /></label>
                  <label class="field"><span>To</span><input id="range-end" type="date" required /></label>
                  <p id="range-error" class="form-error" hidden></p>
                  <div class="range-actions">
                    <button type="button" id="range-cancel" class="btn btn-outline">Cancel</button>
                    <button type="submit" class="btn btn-primary">Apply</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <div id="page-root" class="page-root"></div>
        </main>
      </div>
    </div>

    <script src="/dashboard/vendor/apexcharts.js"></script>
    <script type="module" src="/dashboard/app.js?v=3"></script>
  </body>
</html>
