name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      slug:
        description: Preview folder under /previews/ (letters, numbers, dashes)
        required: true

permissions:
  contents: write
  pull-requests: write

# Production and each preview queue separately, so a preview build can't knock a pending
# main deploy out of the queue. They can run side by side because each one publishes only
# its own part of gh-pages (see "Publish to gh-pages").
concurrency:
  group: github-pages-${{ github.event_name == 'push' && 'production' || format('preview-{0}', github.event.number || inputs.slug) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      VITE_CONFIG_NATIVE_IGNORE_WARNING: true
      VITE_SHOPIFY_STORE_DOMAIN: ${{ secrets.VITE_SHOPIFY_STORE_DOMAIN }}
      VITE_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_TOKEN }}
      VITE_SHOPIFY_API_VERSION: ${{ secrets.VITE_SHOPIFY_API_VERSION }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
      VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
      VITE_GA4_SEND_DIRECT: ${{ secrets.VITE_GA4_SEND_DIRECT }}
      VITE_CONTACT_API_URL: ${{ secrets.VITE_CONTACT_API_URL }}
      PAGES_BASE: /website
      RAW_SLUG: ${{ inputs.slug }}
    outputs:
      slug: ${{ steps.slug.outputs.value }}
      kind: ${{ steps.slug.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch existing site tree
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Prepare site directory
        run: |
          mkdir -p site/previews
          rm -rf site/.git site/.github

      - name: Resolve preview slug
        id: slug
        run: |
          sanitize() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g'
          }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=$(sanitize "$RAW_SLUG")" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "kind=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Seed production site from main
        if: ${{ steps.slug.outputs.kind == 'preview' && !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
        run: |
          if [ -f site/index.html ]; then
            echo "Production site already present"
            exit 0
          fi
          git fetch origin main --depth 1
          mkdir -p /tmp/main-src
          git archive origin/main | tar -x -C /tmp/main-src
          cd /tmp/main-src
          npm ci
          npm run build:staging
          rsync -a dist/ "${GITHUB_WORKSPACE}/site/"

      - name: Install dependencies
        if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
        run: npm ci

      - name: Run unit tests
        if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
        run: npm run test

      - name: Build production site
        if: ${{ steps.slug.outputs.kind == 'production' }}
        env:
          VITE_SITE_ORIGIN: https://sunday-rolls.github.io
        run: |
          # Ensure contact/reviews hit Railway even if the Actions secret is empty.
          export VITE_CONTACT_API_URL="${VITE_CONTACT_API_URL:-https://contact-api-production-9af6.up.railway.app}"
          VITE_BASE_PATH="${PAGES_BASE}/" npm run build:pages
          rsync -a --delete --exclude previews/ dist/ site/

      - name: Build preview site
        if: ${{ steps.slug.outputs.kind == 'preview' && !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
        env:
          VITE_SITE_ORIGIN: https://sunday-rolls.github.io
        run: |
          export VITE_CONTACT_API_URL="${VITE_CONTACT_API_URL:-https://contact-api-production-9af6.up.railway.app}"
          SLUG="${{ steps.slug.outputs.value }}"
          VITE_BASE_PATH="${PAGES_BASE}/previews/${SLUG}/" npm run build:pages
          rm -rf "site/previews/${SLUG}"
          mkdir -p "site/previews/${SLUG}"
          rsync -a dist/ "site/previews/${SLUG}/"

      - name: Remove closed PR preview
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
        run: rm -rf "site/previews/${{ steps.slug.outputs.value }}"

      - name: Install SPA 404 fallback
        run: sed "s|__PAGES_BASE__|${PAGES_BASE}|g" scripts/gh-pages-404.html > site/404.html

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.slug.outputs.kind }}
          SLUG: ${{ steps.slug.outputs.value }}
          CLOSED: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
        run: |
          # Start from the latest gh-pages each attempt and change only this run's part of it:
          # production replaces everything outside previews/, a preview its own previews/<slug>/.
          # If another deploy pushed in between, the push is rejected and we go round again.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf publish
            if ! git clone --quiet --depth 1 --branch gh-pages "$remote" publish; then
              mkdir publish
              git -C publish init --quiet --initial-branch gh-pages
            fi
            if [ "$KIND" = "production" ]; then
              rsync -a --checksum --delete --exclude .git/ --exclude previews/ site/ publish/
            else
              rm -rf "publish/previews/${SLUG}"
              if [ "$CLOSED" != "true" ]; then
                mkdir -p "publish/previews/${SLUG}"
                rsync -a --checksum "site/previews/${SLUG}/" "publish/previews/${SLUG}/"
                # A brand-new gh-pages also needs the production site this preview seeded.
                if [ ! -f publish/index.html ]; then
                  rsync -a --checksum --exclude .git/ --exclude previews/ site/ publish/
                fi
              fi
              cp site/404.html publish/404.html
            fi
            cd publish
            git add -A
            if git diff --cached --quiet; then
              echo "gh-pages already up to date"
              exit 0
            fi
            git commit --quiet -m "Deploy ${KIND}${SLUG:+ ${SLUG}} from ${GITHUB_SHA}"
            if git push --quiet "$remote" HEAD:gh-pages; then
              exit 0
            fi
            cd ..
            echo "gh-pages moved on; retrying ($attempt)"
            sleep $((attempt * 5))
          done
          echo "Could not publish to gh-pages after 5 attempts"
          exit 1

      - name: Comment preview URL
        if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
        uses: actions/github-script@v7
        env:
          PREVIEW_SLUG: ${{ steps.slug.outputs.value }}
        with:
          script: |
            const slug = process.env.PREVIEW_SLUG
            const url = `https://sunday-rolls.github.io/website/previews/${slug}/`
            const body = [
              '## Preview',
              '',
              url,
              '',
              'This public link is what to send the client. The GitHub PR itself is in a private repo.',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((comment) =>
              comment.body?.includes('sunday-rolls.github.io/website/previews/'),
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
